# Local development infrastructure. Used standalone (docker-compose up -d)
# or managed by Tilt via dc_resource. AGENTS.md assumes the database is
# running via this file.
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_db
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ntfy:
    image: docker.io/binwiederhier/ntfy:latest
    command: serve
    ports:
      - "25999:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy

volumes:
  ntfy-cache: