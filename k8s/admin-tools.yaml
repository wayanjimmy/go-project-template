# Admin tools deployment (embedded UI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-tools
  labels:
    app: go-project-template
    component: admin-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-project-template
      component: admin-tools
  template:
    metadata:
      labels:
        app: go-project-template
        component: admin-tools
    spec:
      hostAliases:
        - hostnames:
            - host.containers.internal
          ip: 169.254.1.2
      containers:
        - name: admin-tools
          imagePullPolicy: IfNotPresent
          image: go-project-template/admin-tools
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SECRET_DRIVER
              value: "FILESYSTEM"
            - name: SECRET_ROOT
              value: "/tmp/.secrets"
            - name: SECRET_ENCRYPTION_PARENT
              value: "local"
            - name: SECRET_ENCRYPTION_NAME
              value: "user-data"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-tools
  labels:
    app: go-project-template
    component: admin-tools
spec:
  selector:
    app: go-project-template
    component: admin-tools
  ports:
    - name: http
      port: 80
      targetPort: http
